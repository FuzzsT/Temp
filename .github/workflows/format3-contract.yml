name: format3-contract
on:
  workflow_dispatch:
  push:
    branches: [ fullbridge-0.4.0-renderer-tap ]

jobs:
  contract:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run Cube.zip format3 and transport contract
        shell: powershell
        run: |
          dotnet run --project .\tests\Cube7Bridge.Format3Contract\Cube7Bridge.Format3Contract.csproj -c Release *>&1 | Tee-Object -FilePath .\format3-contract.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run v26 official crypto contract
        shell: powershell
        run: |
          dotnet run --project .\tests\Cube7Bridge.CryptoContract\Cube7Bridge.CryptoContract.csproj -c Release *>&1 | Tee-Object -FilePath .\crypto-contract.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: format3-contract-diagnostics
          path: |
            format3-contract.log
            crypto-contract.log
          if-no-files-found: warn
