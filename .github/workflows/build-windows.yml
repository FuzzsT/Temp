name: build-windows
on:
  workflow_dispatch:
  push:
    branches: [ main, master, fullbridge-0.3.0, fullbridge-0.3.2, fullbridge-0.3.3-auth-trace, fullbridge-0.4.0-renderer-tap, fullbridge-0.4.1-hardened-dryrun, fullbridge-0.4.2-ble-uart-trace, fullbridge-0.5.0-virtual-device-emu, fullbridge-0.6.0-loopback-autoconfig, fullbridge-0.6.1-ble-session-bridge ]

jobs:
  build-x64:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build FullBridge
        shell: powershell
        run: .\build.ps1 -Arch x64 -Publish
      - name: Self-test loopback + official BLE session runtime
        shell: powershell
        run: .\bin\Cube7Bridge.exe --self-test
      - name: Verify required native + managed binaries
        shell: powershell
        run: .\verify-release.ps1 -BinDir .\bin
      - name: Verify 0.6.1 safety and session defaults
        shell: powershell
        run: |
          $cfg = Get-Content .\config.json -Raw | ConvertFrom-Json
          if (-not $cfg.virtualLaserCube.networkServerEnabled) { throw 'networkServerEnabled must default to true' }
          if ($cfg.virtualLaserCube.bindAddress -ne '127.0.0.1') { throw 'bindAddress must default to 127.0.0.1' }
          if ($cfg.allowBleWrites) { throw 'arbitrary BLE writes must remain disabled' }
          if ($cfg.virtualDevice.physicalOutput) { throw 'physicalOutput must remain false' }
          if ($cfg.virtualDevice.allowSyntheticAuthentication) { throw 'allowSyntheticAuthentication must remain false' }
          $version = Get-Content .\VERSION.json -Raw | ConvertFrom-Json
          if ($version.version -ne '0.6.1') { throw 'VERSION.json must be 0.6.1' }
          if ($version.release -ne 'BLE-SESSION-BRIDGE') { throw 'VERSION release mismatch' }
          if (-not $version.ble_session_connect_write_only) { throw 'BLE session must remain connect-write-only' }
          if ($version.features -notcontains 'unpaired-official-ble-session') { throw 'unpaired official BLE session feature missing' }
          if ($version.features -notcontains 'network-auth-b0-b1-trace-only') { throw 'B0/B1 trace-only invariant missing' }
      - name: Stage ready-to-run package
        shell: powershell
        run: |
          $stage = '.\release\Cube7-LaserOS-FullBridge-0.6.1-BLE-SESSION-BRIDGE-win-x64'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item .\bin (Join-Path $stage 'bin') -Recurse -Force
          Copy-Item .\start-full.cmd,.\start-trace.cmd,.\start-ble.cmd,.\README.md,.\config.json,.\VERSION.json -Destination $stage -Force
          Copy-Item .\docs (Join-Path $stage 'docs') -Recurse -Force
          Copy-Item .\protocols (Join-Path $stage 'protocols') -Recurse -Force
          Copy-Item .\scripts (Join-Path $stage 'scripts') -Recurse -Force
          Copy-Item .\verify-release.ps1 (Join-Path $stage 'verify-release.ps1') -Force
          Compress-Archive -Path "$stage\*" -DestinationPath Cube7-LaserOS-FullBridge-0.6.1-BLE-SESSION-BRIDGE-win-x64.zip -Force
      - name: Verify packaged ZIP contents
        shell: powershell
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'fullbridge-verify'
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          Expand-Archive .\Cube7-LaserOS-FullBridge-0.6.1-BLE-SESSION-BRIDGE-win-x64.zip -DestinationPath $tmp
          .\verify-release.ps1 -BinDir (Join-Path $tmp 'bin')
          $cfg = Get-Content (Join-Path $tmp 'config.json') -Raw | ConvertFrom-Json
          if (-not $cfg.virtualLaserCube.networkServerEnabled -or $cfg.virtualLaserCube.bindAddress -ne '127.0.0.1') {
            throw 'Packaged config lost loopback defaults'
          }
          if ($cfg.allowBleWrites -or $cfg.virtualDevice.physicalOutput -or $cfg.virtualDevice.allowSyntheticAuthentication) {
            throw 'Packaged config lost safety defaults'
          }
          $version = Get-Content (Join-Path $tmp 'VERSION.json') -Raw | ConvertFrom-Json
          if ($version.version -ne '0.6.1' -or $version.release -ne 'BLE-SESSION-BRIDGE') {
            throw 'Packaged VERSION.json mismatch'
          }
          if (Test-Path (Join-Path $tmp 'bin\VirtualLaserCube.enabled')) { throw 'runtime injection profile leaked into package' }
          if (Test-Path (Join-Path $tmp 'ble-session-summary.json')) { throw 'runtime BLE session summary leaked into package' }
      - uses: actions/upload-artifact@v4
        with:
          name: Cube7-LaserOS-FullBridge-0.6.1-BLE-SESSION-BRIDGE-win-x64
          path: Cube7-LaserOS-FullBridge-0.6.1-BLE-SESSION-BRIDGE-win-x64.zip
          if-no-files-found: error
